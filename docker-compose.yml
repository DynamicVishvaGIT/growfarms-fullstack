services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: growfarms-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000

    ports:
      - "5000:5000"

    # Everything the admin panel uploads is written to /app/uploads at runtime.
    # Without this volume that folder lives only in the container's writable
    # layer, so every rebuild threw the uploaded files away while their rows
    # stayed in the database — which is why those images 404'd while the
    # seed images, baked into the image itself, kept working.
    #
    # A named volume (not a bind mount) on purpose: Docker seeds an empty one
    # from the image's own /app/uploads, so uploads/seed survives the change.
    volumes:
      - growfarms-uploads:/app/uploads

    networks:
      - two-tier


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: https://growfarm-fullstack.dvworks.in/api
  
    container_name: growfarms-frontend
  
    restart: unless-stopped
  
    ports:
      - "8082:80"
  
    depends_on:
      - backend
  
    networks:
      - two-tier


networks:
  two-tier:
    external: true


volumes:
  growfarms-uploads:
