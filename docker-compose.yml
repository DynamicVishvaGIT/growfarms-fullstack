services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: growfarms-backend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: growfarms_db

    ports:
      - "5000:5000"

    networks:
      - two-tier


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: growfarms-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - two-tier


networks:
  two-tier:
    external: true
