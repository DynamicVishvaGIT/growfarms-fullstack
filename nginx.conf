server {
    listen 80;
    listen [::]:80;

    server_name growfarm-fullstack.dvworks.in;

    root /usr/share/nginx/html;
    index index.html;

    # The admin panel is a second SPA mounted at /admin (see `base` in
    # admin/vite.config.js). It needs its own fallback: without this block the
    # `location /` rule below catches /admin/* and serves the PUBLIC site's
    # index.html, so any direct link or refresh on an admin route loaded the
    # marketing site instead of the panel. Longest-prefix wins in nginx, so
    # this takes precedence over `location /`.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
